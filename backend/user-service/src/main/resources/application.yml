server:
  port: ${PORT:8081}

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:userdb}${DB_PARAMS:}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:c29tZS12ZXJ5LWxvbmctc2VjcmV0LWtleS1mb3ItanNvbi13ZWItdG9rZW5zLWNoYW5nZS1tZQ==}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.ecommerce.user: INFO
